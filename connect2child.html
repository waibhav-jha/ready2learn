<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect2Child — Evidence-based parent support for everyday interactions | Dr. Chitra Sankar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4A236E;
    --primary-dark: #351452;
    --primary-light: #6A4B87;
    --purple-outline: #8B5AC7;
    --lavender: #D8C6EC;
    --coral: #FF5A2E;
    --coral-dark: #E0481F;
    --gold: #D97706;
    --gold-light: #FFA97D;
    --peach-bg: #FBF9F7;
    --peach-card: #F8F3F0;
    --peach-card-2: #FDE9E5;
    --ink: #2D1147;
    --ink-soft: #5E526B;
    --ink-faint: #8E7F9B;
    --green: #16A34A;
    --green-bg: #DCFCE7;
    --amber: #D97706;
    --amber-bg: #FEF3C7;
    --grey-nt: #CBD5E1;
    --grey-nt-bg: #F1F5F9;
    --white: #FFFFFF;
    --shadow: 0 4px 16px rgba(74, 35, 110, 0.06);
    --shadow-lg: 0 12px 32px rgba(74, 35, 110, 0.12);
    --shadow-orange: 0 8px 20px rgba(255, 90, 46, 0.25);
    --radius: 18px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }
  :focus-visible {
    outline: 3px solid var(--coral);
    outline-offset: 2px;
    border-radius: 6px;
  }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--peach-bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-weight: 800;
    color: var(--primary);
    margin: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--peach-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: 84px;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    background: var(--peach-bg);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--coral));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: var(--shadow);
  }
  .brand-name {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--primary);
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--lavender);
    background: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--primary);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn:hover { background: var(--peach-card); }
  .icon-btn:active { transform: scale(0.94); }

  .back-row {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px 4px;
  }
  .back-btn {
    border: 1px solid var(--lavender);
    background: var(--white);
    border-radius: 50%; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); font-size: 16px; color: var(--primary);
    transition: all 0.2s;
  }
  .back-btn:hover { background: var(--peach-card); }

  /* ---------- Persistent save reminder ---------- */
  .save-strip {
    margin: 0 20px 10px;
    background: var(--peach-card-2);
    border: 1px solid #FFD8CE;
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--primary-light);
    display: flex; align-items: center; gap: 6px;
    font-weight: 600;
  }

  /* ---------- Screens ---------- */
  .screen { padding: 4px 20px 20px; animation: fadein 0.25s ease; }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .hero-title {
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .tagline {
    color: var(--coral);
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 4px;
  }
  .byline {
    color: var(--ink-faint);
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 18px;
  }
  p.body-text { color: var(--ink-soft); margin: 0 0 14px; line-height: 1.6; }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(139, 90, 199, 0.12);
    margin-bottom: 14px;
  }
  .card.soft {
    background: var(--peach-card);
    border: 1px solid rgba(139, 90, 199, 0.08);
    box-shadow: none;
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: white;
    border: none;
    padding: 15px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    box-shadow: var(--shadow-orange);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(255, 90, 46, 0.35);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary[disabled] { background: var(--grey-nt); box-shadow: none; color: #9CA3AF; }

  .btn-secondary {
    width: 100%;
    background: var(--white);
    color: var(--primary);
    border: 2px solid var(--lavender);
    padding: 13px 20px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    transition: all 0.2s ease;
  }
  .btn-secondary:hover {
    border-color: var(--purple-outline);
    background: var(--peach-card);
  }

  .btn-text {
    background: none; border: none; color: var(--purple-outline);
    font-size: 14px; font-weight: 600; text-decoration: underline; padding: 6px;
  }

  /* ---------- Onboarding ---------- */
  .onboard-wrap { padding: 40px 24px 24px; text-align: center; }
  .onboard-mark {
    width: 80px; height: 80px; margin: 0 auto 18px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--primary), var(--coral));
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    box-shadow: var(--shadow-lg);
  }
  .hero-photo {
    width: 100%; max-width: 320px; border-radius: 20px;
    box-shadow: var(--shadow-lg); margin: 4px auto 18px; display: block;
  }
  .domain-photo {
    width: 100%; border-radius: 16px;
    box-shadow: var(--shadow); margin-bottom: 14px; display: block;
  }
  .onboard-wrap .hero-title { text-align: center; }
  .onboard-wrap .tagline { text-align: center; }
  .feature-row {
    display: flex; align-items: flex-start; gap: 12px;
    text-align: left; margin-bottom: 14px;
  }
  .feature-row .emoji { font-size: 22px; }
  .feature-row .txt { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; }
  .feature-row .txt b { color: var(--ink); }

  /* ---------- Domain grid ---------- */
  .domain-grid { display: flex; flex-direction: column; gap: 10px; }
  .domain-pick {
    display: flex; align-items: center; gap: 14px;
    background: var(--white); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
    border: 2px solid transparent;
    transition: all 0.2s ease;
  }
  .domain-pick.selected { border-color: var(--purple-outline); background: var(--peach-card); }
  .domain-pick .badge {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--peach-card-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .domain-pick.selected .badge { background: linear-gradient(135deg, var(--primary), var(--purple-outline)); color: white; }
  .domain-pick .info { flex: 1; }
  .domain-pick .info .t { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 15.5px; color: var(--primary); }
  .domain-pick .info .s { font-size: 12.5px; color: var(--ink-faint); }
  .check-dot {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--grey-nt); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: white;
  }
  .domain-pick.selected .check-dot { background: var(--coral); border-color: var(--coral); }

  /* ---------- Home dashboard ---------- */
  .home-domain-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--white); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
    border: 1px solid rgba(139, 90, 199, 0.12);
    margin-bottom: 12px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .home-domain-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }
  .home-domain-card .badge {
    width: 52px; height: 52px; border-radius: 16px;
    background: var(--peach-card-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .home-domain-card .info { flex: 1; min-width: 0; }
  .home-domain-card .t { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 16px; color: var(--primary); }
  .home-domain-card .meta { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
  .nudge-badge {
    display: inline-block; margin-top: 5px;
    background: var(--amber-bg); color: var(--amber);
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
  }
  .chevron { color: var(--purple-outline); font-size: 22px; }

  .add-domain-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 2px dashed var(--lavender); border-radius: var(--radius);
    padding: 14px; color: var(--primary); font-weight: 700;
    background: transparent; width: 100%; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    transition: all 0.2s ease;
  }
  .add-domain-btn:hover {
    border-color: var(--purple-outline);
    background: var(--peach-card);
  }

  .wins-trail {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .win-star { font-size: 18px; }

  /* ---------- Tabs ---------- */
  .tabbar-wrap { position: relative; margin-bottom: 16px; }
  .tabbar-wrap::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 2px; width: 28px;
    background: linear-gradient(to right, rgba(251, 249, 247, 0), var(--peach-bg));
    pointer-events: none;
  }
  .tabbar {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    background: var(--white);
    border: 1.5px solid rgba(139, 90, 199, 0.15);
    color: var(--ink-soft);
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
  }
  .tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 4px 14px rgba(74, 35, 110, 0.25);
  }

  /* ---------- Stage list ---------- */
  .stage-item {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .stage-text { font-size: 14.5px; font-weight: 600; color: var(--ink); margin-bottom: 12px; line-height: 1.5; }
  .mark-row { display: flex; gap: 8px; }
  .mark-btn {
    flex: 1; border: 1.5px solid #E2D9EC; background: var(--white);
    border-radius: 10px; padding: 9px 4px; font-size: 12.5px; font-weight: 700;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink-faint);
    transition: all 0.15s ease;
  }
  .mark-btn.active-done { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .mark-btn.active-progress { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
  .mark-btn.active-notyet { background: var(--grey-nt-bg); border-color: var(--grey-nt); color: var(--ink-soft); }

  /* ---------- Word bank ---------- */
  .word-cat { margin-bottom: 18px; }
  .word-cat-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--primary); }

  /* ---------- Common Mistakes ---------- */
  .mistake-card {
    background: var(--white); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow);
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .mistake-instead { font-size: 13.5px; color: var(--ink-faint); line-height: 1.45; }
  .mistake-try { font-size: 14px; color: var(--ink); font-weight: 600; line-height: 1.45; }
  .mistake-arrow { text-align: center; color: var(--coral); font-size: 13px; margin: 4px 0; }
  .mistake-tag {
    display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--ink-faint); background: var(--grey-nt-bg);
    border-radius: 6px; padding: 2px 7px; margin-right: 6px; vertical-align: middle;
  }
  .mistake-tag.try { color: white; background: var(--green); }
  .word-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .word-chip {
    border: none; padding: 8px 14px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; background: var(--peach-card);
    color: var(--ink-soft);
  }
  .word-chip.understands { background: var(--grey-nt-bg); color: var(--ink-soft); }
  .word-chip.tries { background: var(--amber-bg); color: var(--amber); }
  .word-chip.says { background: var(--green-bg); color: var(--green); }

  .word-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--peach-card); border-radius: 999px;
    padding: 4px 6px 4px 14px;
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .word-pill .word-label { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .re-btn {
    width: 26px; height: 26px; border: none; border-radius: 50%;
    font-size: 11px; font-weight: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--grey-nt-bg); color: var(--ink-faint); padding: 0; line-height: 1;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .re-btn.r-active { background: var(--primary); color: white; }
  .re-btn.e-tries { background: var(--amber-bg); color: var(--amber); }
  .re-btn.e-says { background: var(--green-bg); color: var(--green); }
  .re-legend { display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; font-weight: 600; }
  .re-legend .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: white; margin-right: 4px; }
  .gesture-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--peach-card); border-radius: 12px;
    padding: 10px 10px 10px 14px; margin-bottom: 8px;
    border: 1px solid rgba(139, 90, 199, 0.08);
  }
  .gesture-row .gesture-label { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--ink); }

  /* ---------- Activities / tips ---------- */
  .wait-banner {
    display: flex; align-items: center; gap: 10px;
    background: var(--peach-card-2); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--ink);
  }
  .wait-banner .hourglass { font-size: 20px; }
  .step-diagram { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .step-diagram .sd-step { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .step-diagram .sd-circle {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--coral));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 4px 12px rgba(74, 35, 110, 0.2); margin-bottom: 6px;
  }
  .step-diagram .sd-label { font-size: 11px; font-weight: 700; text-align: center; color: var(--ink); line-height: 1.25; }
  .step-diagram .sd-arrow { color: var(--purple-outline); font-size: 16px; padding-top: 10px; flex: 0 0 auto; }
  .activity-item {
    background: var(--white); border-radius: var(--radius); padding: 14px 16px;
    margin-bottom: 10px; box-shadow: var(--shadow); font-size: 14.5px;
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .activity-item .principle { display: block; margin-top: 6px; font-size: 12px; color: var(--primary); font-weight: 700; }
  .fav-field { margin-bottom: 14px; }
  .fav-field label { display: block; font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }

  .tipbox {
    background: var(--peach-card);
    border-left: 4px solid var(--coral);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 14px 0;
  }
  .tipbox .lbl { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 13px; color: var(--primary); margin-bottom: 4px; }
  .tipbox .txt { font-size: 14px; color: var(--ink-soft); font-style: italic; line-height: 1.55; }

  /* ---------- Cycle ---------- */
  .week-track { display: flex; gap: 8px; margin-bottom: 16px; }
  .week-dot {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px;
    background: var(--white); box-shadow: var(--shadow); font-size: 11px; font-weight: 700;
    color: var(--ink-faint);
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .week-dot .wk-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .week-dot.current { background: var(--coral); color: white; border-color: var(--coral); }
  .week-dot.done { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .week-card { background: var(--white); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid rgba(139, 90, 199, 0.1); }
  .gen-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--white); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; border: 1px solid #E2D9EC; width: 100%; text-align: left;
    cursor: pointer;
  }
  .gen-check {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    border: 2px solid #D8C6EC; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: white;
  }
  .gen-item.checked .gen-check { background: var(--green); border-color: var(--green); }
  .gen-item .gen-label { font-size: 13.5px; color: var(--ink); font-weight: 600; }
  .gen-item.checked .gen-label { color: var(--ink-faint); text-decoration: line-through; }
  .week-card .wk-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 6px; color: var(--primary); }
  .week-card .wk-text { font-size: 14.5px; color: var(--ink-soft); }
  .cycle-meta { font-size: 13px; color: var(--ink-faint); margin-bottom: 14px; }

  /* ---------- Small wins ---------- */
  textarea, input[type=text] {
    width: 100%; border: 1.5px solid #E2D9EC; border-radius: var(--radius-sm);
    padding: 12px; font-family: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--white); resize: vertical;
    outline: none;
    transition: all 0.2s;
  }
  textarea:focus, input[type=text]:focus {
    border-color: var(--purple-outline);
    box-shadow: 0 0 0 3px rgba(139, 90, 199, 0.15);
  }
  .win-entry {
    background: var(--white); border-radius: var(--radius-sm); padding: 12px 14px;
    margin-bottom: 8px; box-shadow: var(--shadow); font-size: 14px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    border: 1px solid rgba(139, 90, 199, 0.1);
  }
  .delete-btn {
    border: none; background: none; color: var(--ink-faint); font-size: 15px;
    padding: 2px 4px; flex-shrink: 0; line-height: 1; cursor: pointer;
  }
  .delete-btn:active { color: var(--coral); }
  .win-entry .date { font-size: 11.5px; color: var(--primary-light); font-weight: 700; margin-bottom: 3px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav {

function loadState() {
  let s;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    s = raw ? JSON.parse(raw) : null;
  } catch (e) { s = null; }
  if (!s) {
    s = {
      firstUseSeen: false,
      selectedDomains: [],
      domainState: {},
      smallWins: [],
      lastExportDate: null
    };
  }
  if (!s.favorites) s.favorites = defaultFavorites();
  if (s.tabHintSeen === undefined) s.tabHintSeen = false;
  return s;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("Connect2Child: could not save — storage may be full or unavailable.", e);
  }
}

function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysSince(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
function ensureDomainState(id) {
  if (!state.domainState[id]) state.domainState[id] = defaultDomainState();
  if (!state.domainState[id].customActivities) state.domainState[id].customActivities = [];
  if (!state.domainState[id].generalization) state.domainState[id].generalization = defaultGeneralization();
  if (!state.domainState[id].gestureMarks) state.domainState[id].gestureMarks = {};
  if (!state.domainState[id].playSkillMarks) state.domainState[id].playSkillMarks = {};
  return state.domainState[id];
}

function getFocusKey(el) {
  if (!el || el === document.body || !app.contains(el)) return null;
  const stableAttrs = ["data-mark", "data-play-mark", "data-toggle-domain", "data-open-domain",
    "data-word-r", "data-word-e", "data-gesture-r", "data-gesture-e",
    "data-tab", "data-nav", "data-action", "data-before-start"];
  for (const attr of stableAttrs) {
    const val = el.getAttribute(attr);
    if (val !== null) return `[${attr}="${CSS.escape(val)}"]`;
  }
  if (el.id) return `#${CSS.escape(el.id)}`;
  return null;
}

function restoreFocus(key) {
  if (!key) return;
  try {
    const el = document.querySelector(key);
    if (el) el.focus();
  } catch (e) {}
}

function render() {
  const focusKey = getFocusKey(document.activeElement);
  let html = "";
  if (!state.firstUseSeen) {
    html += renderFirstUseGate();
  } else if (route.screen === "onboard") {
    html += renderOnboard();
  } else if (route.screen === "domainPicker") {
    html += renderDomainPicker();
  } else if (route.screen === "home") {
    html += renderTopbar() + renderHome() + renderBottomNav("home");
  } else if (route.screen === "domain") {
    html += renderDomainScreen();
  } else if (route.screen === "bank") {
    html += renderTopbar() + renderActivitiesBank() + renderBottomNav("bank");
  } else if (route.screen === "export") {
    html += renderTopbar() + renderExport() + renderBottomNav("export");
  } else if (route.screen === "about") {
    html += renderAbout();
  } else if (route.screen === "favorites") {
    html += renderFavoritesScreen();
  }
  app.innerHTML = html;
  if (modal) renderModal();
  attachHandlers();
  restoreFocus(focusKey);
}

function currentStageIndex(d, ds) {
  for (let i = 0; i < d.stages.length; i++) {
    if ((ds.stageMarks[i] || "notyet") !== "done") return i;
  }
  return d.stages.length - 1;
}

function stageProgress(d, ds) {
  const total = d.stages.length;
  if (!total) return 0;
  let credit = 0;
  d.stages.forEach((s, i) => {
    const m = ds.stageMarks[i];
    if (m === "done") credit += 1;
    else if (m === "progress") credit += 0.5;
  });
  return Math.round(100 * credit / total);
}
function progressRing(percent, size, strokeW) {
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - percent / 100);
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="${strokeW}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="white" stroke-width="${strokeW}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

}

function renderWordsTab(d, ds) {
  const cats = d.wordCategories.map(c => {
    const pills = c.words.map(w => {
      const mark = getWordMark(ds, w);
      const eClass = mark.e === 2 ? "e-says" : mark.e === 1 ? "e-tries" : "";
      return `<span class="word-pill" data-word-text="${escapeHtml(w.toLowerCase())}">
        <span class="word-label">${w}</span>
        <button class="re-btn ${mark.r ? "r-active" : ""}" data-word-r="${d.id}|${escapeHtml(w)}" title="Understands (receptive)" aria-label="Understands, receptive" aria-pressed="${!!mark.r}">R</button>
        <button class="re-btn ${eClass}" data-word-e="${d.id}|${escapeHtml(w)}" title="Says (expressive)" aria-label="Says, expressive">E</button>
      </span>`;
    }).join("");
    return `<div class="word-cat" data-cat-block>
      <div class="word-cat-title">${c.cat}</div>
      <div class="word-chips">${pills}</div>
    </div>`;
  }).join("");

  const totalWords = d.wordCategories.reduce((n, c) => n + c.words.length, 0);
  const allMarks = d.wordCategories.flatMap(c => c.words).map(w => getWordMark(ds, w));
  const receptiveCount = allMarks.filter(m => m.r).length;
  const saysCount = allMarks.filter(m => m.e === 2).length;
  const triesCount = allMarks.filter(m => m.e === 1).length;

  const celebration = celebrationMsg ? `
    <div class="card" style="background:linear-gradient(135deg, var(--coral), var(--gold-light));text-align:center;padding:18px">
      <div style="font-size:17px;font-weight:800;color:white;font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">${celebrationMsg}</div>
      <button class="btn-text" data-action="dismiss-celebration" style="color:rgba(255,255,255,0.85);text-decoration:underline;margin-top:6px">Nice!</button>
    </div>` : "";

  return `
    ${celebration}
    <div class="card soft" style="padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft)">
        <span>👂 ${receptiveCount} understand · <b style="font-size:16px;color:var(--coral-dark)">🗣️ ${saysCount}</b> say clearly</span>
        <span style="color:var(--ink-faint)">/${totalWords}</span>
      </div>
      <div style="display:flex;gap:4px;height:6px;margin-top:6px">
        <div style="flex:1;background:var(--peach-card-2);border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${totalWords ? Math.round(100*receptiveCount/totalWords) : 0}%;background:var(--gold);border-radius:999px"></div>
        </div>
        <div style="flex:1;background:var(--peach-card-2);border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${totalWords ? Math.round(100*(saysCount+triesCount)/totalWords) : 0}%;background:var(--coral);border-radius:999px"></div>
        </div>
      </div>
    </div>
    <div class="re-legend">
      <span><span class="dot" style="background:var(--gold)">R</span>Understands (receptive)</span>
      <span><span class="dot" style="background:var(--coral)">E</span>Says (expressive)</span>
    </div>
    <input type="text" id="word-search-input" placeholder="🔍 Search words..." value="${escapeHtml(wordSearchQuery)}" style="margin-bottom:14px">
    <p class="body-text" id="no-word-match" style="display:none">No words match your search.</p>
    <div class="tipbox"><div class="lbl">🩺 How This List Grows</div><div class="txt">${d.growthNote}</div></div>
    <div class="card" style="background:var(--peach-card-2);border:2px solid var(--coral)">
      <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;color:var(--coral-dark);margin-bottom:6px">💡 How to mark a word</div>
      <p class="body-text" style="margin-bottom:0">Tap <b>R</b> when your child understands a word. Tap <b>E</b> once when they try to say it, tap again when they say it clearly.</p>
    </div>
    ${cats}
  `;
}

function getGestureMark(ds, gesture) {
  const m = ds.gestureMarks[gesture];
  if (m && typeof m === "object") return { r: !!m.r, e: m.e || 0 };
  return { r: false, e: 0 };
}

function renderGesturesTab(d, ds) {
  const cats = d.gestureCategories.map(c => {
    const rows = c.gestures.map(g => {
      const mark = getGestureMark(ds, g);

      return `<div class="gesture-row">
        <span class="gesture-label">${g}</span>
        <button class="re-btn ${mark.r ? "r-active" : ""}" data-gesture-r="${d.id}|${escapeHtml(g)}" title="Understands (receptive)" aria-label="Understands, receptive" aria-pressed="${!!mark.r}">R</button>
        <button class="re-btn ${eClass}" data-gesture-e="${d.id}|${escapeHtml(g)}" title="Does this (expressive)" aria-label="Does this">E</button>

  const totalGestures = d.gestureCategories.reduce((n, c) => n + c.gestures.length, 0);
  const allMarks = d.gestureCategories.flatMap(c => c.gestures).map(g => getGestureMark(ds, g));
  const receptiveCount = allMarks.filter(m => m.r).length;
  const doesCount = allMarks.filter(m => m.e === 2).length;
  const triesCount = allMarks.filter(m => m.e === 1).length;

  return `
    <div class="card soft" style="padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft)">
        <span>👀 ${receptiveCount} understand · <b style="font-size:16px;color:var(--coral-dark)">🖐️ ${doesCount}</b> do it</span>
        <span style="color:var(--ink-faint)">/${totalGestures}</span>
      </div>
      <div style="display:flex;gap:4px;height:6px;margin-top:6px">
        <div style="flex:1;background:var(--peach-card-2);border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${totalGestures ? Math.round(100*receptiveCount/totalGestures) : 0}%;background:var(--gold);border-radius:999px"></div>
        </div>
        <div style="flex:1;background:var(--peach-card-2);border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${totalGestures ? Math.round(100*(doesCount+triesCount)/totalGestures) : 0}%;background:var(--coral);border-radius:999px"></div>
        </div>
      </div>
    </div>
    <div class="re-legend">
      <span><span class="dot" style="background:var(--gold)">R</span>Understands (receptive)</span>
      <span><span class="dot" style="background:var(--coral)">E</span>Does it (expressive)</span>
    </div>
    <div class="tipbox"><div class="lbl">🩺 About These Gestures</div><div class="txt">${d.gestureGrowthNote}</div></div>
    <div class="card" style="background:var(--peach-card-2);border:2px solid var(--coral)">
      <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;color:var(--coral-dark);margin-bottom:6px">💡 How to mark a gesture</div>
      <p class="body-text" style="margin-bottom:0">Tap <b>R</b> when your child understands the gesture. Tap <b>E</b> once when they try it, tap again when they do it clearly.</p>
    </div>
    ${cats}
  `;
}

function renderPlaySkillsTab(d, ds) {
  const cats = d.playSkillCategories.map(c => {
    const items = c.skills.map((s, i) => {
      const key = c.cat + "|" + i;
      const mark = ds.playSkillMarks[key] || "notyet";
      return `
      <div class="stage-item">
        <div class="stage-text">${s}</div>
        <div class="mark-row">
          <button class="mark-btn ${mark==="done"?"active-done":""}" data-play-mark="${d.id}|${escapeHtml(key)}|done" aria-pressed="${mark==="done"}">✓ Done</button>
          <button class="mark-btn ${mark==="progress"?"active-progress":""}" data-play-mark="${d.id}|${escapeHtml(key)}|progress" aria-pressed="${mark==="progress"}">~ In Progress</button>
          <button class="mark-btn ${mark==="notyet"?"active-notyet":""}" data-play-mark="${d.id}|${escapeHtml(key)}|notyet" aria-pressed="${mark==="notyet"}">— Not Yet</button>
        </div>
      </div>`;
    }).join("");
    return `<h3 style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;font-size:14px;color:var(--gold);margin:16px 0 8px">${c.cat}</h3>${items}`;
  }).join("");

  const totalSkills = d.playSkillCategories.reduce((n, c) => n + c.skills.length, 0);
  let doneCount = 0, progressCount = 0;
  d.playSkillCategories.forEach(c => c.skills.forEach((s, i) => {
    const mark = ds.playSkillMarks[c.cat + "|" + i];
    if (mark === "done") doneCount++;
    else if (mark === "progress") progressCount++;
  }));

  return `
    <div class="card soft" style="padding:12px 16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-soft)">
        <span>🧸 <b style="font-size:16px;color:var(--coral-dark)">${doneCount}</b> skills, ${progressCount} in progress</span>
        <span style="color:var(--ink-faint)">/${totalSkills}</span>
      </div>
      <div style="height:6px;background:var(--peach-card-2);border-radius:999px;margin-top:6px;overflow:hidden">
        <div style="height:100%;width:${totalSkills ? Math.round(100*(doneCount + progressCount*0.5)/totalSkills) : 0}%;background:var(--coral);border-radius:999px"></div>
      </div>
    </div>
    <div class="tipbox"><div class="lbl">🩺 How To Use This List</div><div class="txt">${d.playChecklistNote}</div></div>

}

function renderMaterialsTab(d) {
  const cats = d.materialCategories.map(c => `
    <div class="word-cat">

      ${c.items.map(item => `<div class="activity-item" style="margin-bottom:8px">${item}</div>`).join("")}

  }
  return `

    <div class="word-cat"><div class="word-cat-title">2-Step — Steps That Go Together</div>${chipList(d.twoStepLinked)}</div>

function mistakeCard(item) {
  return `
    <div class="mistake-card">
      <div class="mistake-instead"><span class="mistake-tag">Instead of</span> ${item.instead}</div>
      <div class="mistake-arrow">↓</div>
      <div class="mistake-try"><span class="mistake-tag try">Try</span> ${item.try}</div>
    </div>`;
}

function renderMistakesTab(d) {
  const intro = `
    <p class="body-text">Every parent falls into these patterns sometimes — they're natural instincts, not failures. Here's a gentler alternative for each one.</p>`;

  if (d.mistakesGroups) {
    const groups = d.mistakesGroups.map(g => `
      <div class="word-cat-title" style="margin-top:18px">${g.cat}</div>
      ${g.items.map(mistakeCard).join("")}
    `).join("");
    return intro + groups;
  }

  return intro + (d.mistakes || []).map(mistakeCard).join("");
}

function renderCycleTab(d, ds) {
  const WEEK_ICONS = ["👀", "🌱", "🔄", "✅"];
  const weekDots = [1,2,3,4].map(w => {
    const cls = w < ds.cycleWeek ? "done" : (w === ds.cycleWeek ? "current" : "");
    return `<div class="week-dot ${cls}"><span class="wk-icon">${WEEK_ICONS[w-1]}</span>Wk ${w}</div>`;
  }).join("");
  const wk = WEEK_PLAN[ds.cycleWeek - 1];
  const isLastWeek = ds.cycleWeek === 4;

  const curStage = currentStageIndex(d, ds);
  function relevance(a) {
    if (a.stage === curStage) return 0;
    if (a.stage === undefined) return 1;
    return 2;
  }
  const rawActivities = (d.ndbiActivities || []).concat((ds.customActivities || []).map(c => ({ text: c.text, stage: undefined })));
  const allActivities = rawActivities
    .map((a, i) => ({ ...a, origIndex: i }))
    .sort((a, b) => relevance(a) - relevance(b) || a.origIndex - b.origIndex)
    .map(a => a.text);
  const pct = stageProgress(d, ds);
  const isStuck = ds.cycleCount >= 3 && pct === 0;

  function ideaLine(t) {
    return `<div class="body-text" style="margin-bottom:8px">• ${t}</div>`;
  }

  let ideasBlock = "";
  if (isStuck && allActivities.length) {
    const offset = (ds.cycleCount - 1) % allActivities.length;
    const rotated = [allActivities[offset], allActivities[(offset + 1) % allActivities.length]];
    ideasBlock = `
      <div class="card soft" style="border:2px solid var(--peach-card-2)">
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin-bottom:6px">💡 Let's try something different this round</div>
        <p class="body-text" style="font-size:13px">You've been on this stage for ${ds.cycleCount} rounds. Here's a different idea to try this time:</p>
        ${rotated.map(ideaLine).join("")}
      </div>`;
  } else if ((ds.cycleWeek === 2 || ds.cycleWeek === 3) && allActivities.length) {
    const weekIndex = ds.cycleWeek - 2;
    const step = (ds.cycleCount - 1) * 2 + weekIndex;
    const offset = (step * 3) % allActivities.length;
    const picks = [0, 1, 2].map(i => allActivities[(offset + i) % allActivities.length]);
    ideasBlock = `
      <div class="card">
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin-bottom:8px">💡 Ideas to try this week</div>
        ${picks.map(ideaLine).join("")}
        <p class="body-text" style="font-size:12.5px;margin-bottom:0">See the Activities tab for the full list.</p>
      </div>`;
  }

  const GEN_ITEMS = [
    ["mom", "Tried with Mom"],
    ["dad", "Tried with Dad"],
    ["other", "Tried with another caregiver (grandparent, nanny, etc.)"],
    ["newRoom", "Tried in a new room"],
    ["newToy", "Tried with a different toy or material"]
  ];
  const gen = ds.generalization || defaultGeneralization();
  const genCheckedCount = GEN_ITEMS.filter(([key]) => gen[key]).length;

  let genBlock = "";
  if (ds.cycleWeek === 3) {
    genBlock = `
      <div class="card">
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin-bottom:4px">🌍 Generalisation Checklist</div>
        <p class="body-text" style="font-size:12.5px">Check off each one as you try it this week.</p>
        ${GEN_ITEMS.map(([key, label]) => `
          <button class="gen-item ${gen[key] ? "checked" : ""}" data-toggle-gen="${d.id}|${key}">
            <span class="gen-check">${gen[key] ? "✓" : ""}</span>
            <span class="gen-label">${label}</span>
          </button>
        `).join("")}
      </div>`;
  } else if (ds.cycleWeek === 4 && genCheckedCount > 0) {
    genBlock = `
      <div class="card soft">
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin-bottom:4px">🌍 Generalisation this round</div>
        <p class="body-text" style="font-size:13px;margin-bottom:0">You tried this in ${genCheckedCount} of 5 ways.</p>
      </div>`;
  }

  return `
    <div class="cycle-meta">Round ${ds.cycleCount} of this area's 4-week plan. Started ${formatDate(ds.cycleStartDate)}. ${pct}% of stages done.</div>
    <div class="week-track">${weekDots}</div>
    <div class="week-card">
      <div class="wk-title">${wk.title}</div>
      <div class="wk-text">${wk.text}</div>
    </div>
    ${genBlock}
    ${ideasBlock}
    ${isLastWeek
      ? `<div class="card" style="background:var(--peach-card-2);border:2px solid var(--coral);margin-bottom:12px">
           <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;color:var(--coral-dark);margin-bottom:6px">👉 Before you tap below</div>
           <p class="body-text" style="margin-bottom:0">If your child moved to a new stage, go mark it in the <b>Checklist</b> tab first.</p>
         </div>
         <button class="btn-primary" data-action="advance-cycle|${d.id}">Check list again & start next round</button>`
      : `<button class="btn-primary" data-action="advance-week|${d.id}">Mark this week done, move to next</button>`
    }
  `;
}

function renderWinsTab(d) {
  const wins = state.smallWins.filter(w => w.domainId === d.id).sort((a,b) => b.date.localeCompare(a.date));
  const list = wins.length
    ? wins.map(w => `<div class="win-entry"><div><div class="date">${formatDate(w.date)}</div>${escapeHtml(w.text)}</div><button class="delete-btn" data-action="confirm-delete-win|${w.id}" aria-label="Delete this small win">🗑️</button></div>`).join("")
    : `<p class="body-text">Nothing logged for this area yet.</p>`;

/* ---- Export ---- */
function renderExport() {
  const domainsToShow = DOMAINS.filter(d => state.selectedDomains.includes(d.id));
  const summary = domainsToShow.map(d => {
    const ds = ensureDomainState(d.id);
    const stageLines = d.stages.map((s,i) => {
      const mark = ds.stageMarks[i] || "notyet";
      const symbol = mark === "done" ? "✓" : mark === "progress" ? "~" : "—";
      return `<div style="font-size:13px;margin-bottom:3px">${symbol} ${s}</div>`;
    }).join("");
    const wordLine = d.hasWordBank ? (() => {
      const allMarks = d.wordCategories.flatMap(c => c.words).map(w => getWordMark(ds, w));
      const r = allMarks.filter(m => m.r).length;
      const says = allMarks.filter(m => m.e === 2).length;
      const tries = allMarks.filter(m => m.e === 1).length;
      return `<div style="font-size:13px;margin-bottom:6px;color:var(--ink-soft)">Words: ${r} understood (receptive) · ${says} said clearly, ${tries} trying (expressive)</div>`;
    })() : "";
    const beforeLine = ds.beforeYouStart && ds.beforeYouStart.trim()
      ? `<div style="font-size:13px;margin-bottom:6px;color:var(--ink-soft);font-style:italic">🔍 Before starting: "${escapeHtml(ds.beforeYouStart.trim())}"</div>`
      : "";
    const gen = ds.generalization || defaultGeneralization();
    const genLabels = { mom: "Mom", dad: "Dad", other: "another caregiver", newRoom: "a new room", newToy: "a different toy" };
    const genTried = Object.keys(genLabels).filter(k => gen[k]).map(k => genLabels[k]);
    const genLine = genTried.length
      ? `<div style="font-size:13px;margin-bottom:6px;color:var(--ink-soft)">🌍 Generalised with: ${genTried.join(", ")}</div>`
      : "";
    return `
    <div class="card">
      <div style="font-family:'Quicksand',sans-serif;font-weight:700;margin-bottom:8px">${d.icon} ${d.title} — Week ${ds.cycleWeek}, Round ${ds.cycleCount}</div>
      ${beforeLine}
      ${wordLine}
      ${genLine}
      ${stageLines}
    </div>`;
  }).join("");

  const wins = state.smallWins.slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0, 20);
  const winsList = wins.length ? wins.map(w => {
    const dm = getDomain(w.domainId);
    return `<div style="font-size:13px;margin-bottom:4px">${formatDate(w.date)} — ${dm ? dm.icon : ""} ${escapeHtml(w.text)}</div>`;
  }).join("") : `<div style="font-size:13px;color:var(--ink-faint)">No small wins logged yet.</div>`;

  return `
  <div class="screen">
    <h1 class="hero-title" style="font-size:22px">📤 Export Summary</h1>
    <p class="body-text" style="margin-bottom:2px">A printable summary of progress — useful to share with a therapist or paediatrician.</p>
    <p class="body-text" style="font-size:12px;color:var(--ink-faint);margin-bottom:14px">Connect2Child — by Dr Chitra Sankar, Developmental Paediatrician</p>
    <button class="btn-primary" data-action="do-export">🖨️ Print / Save as PDF</button>
    <div style="height:6px"></div>
    ${state.lastExportDate ? `<p class="body-text" style="font-size:12.5px">Last exported: ${formatDate(state.lastExportDate)}</p>` : ""}
    <div style="height:10px"></div>
    <p class="body-text" style="font-size:12px;color:var(--ink-faint)">Legend: ✓ Done &nbsp; ~ In Progress &nbsp; — Not Yet</p>
    ${summary || `<p class="body-text">No areas selected yet.</p>`}
    <div class="card">
      <div style="font-family:'Quicksand',sans-serif;font-weight:700;margin-bottom:8px">⭐ Recent Small Wins</div>
      ${winsList}
    </div>
    <p class="body-text" style="font-size:11px;color:var(--ink-faint);text-align:center;margin-top:10px">© 2026 Dr Chitra Sankar. All rights reserved.</p>
  </div>`;
}

/* ---- Reset modal ---- */
function renderModal() {
  if (!modal) return;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  if (modal === "reset") {
    overlay.innerHTML = `
      <div class="modal-sheet">
        <h2>😌 Reset & Reconnect</h2>
        <p class="body-text">Never force an activity. Here's what to watch for and what to try.</p>
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin:12px 0 6px">⚠️ Signs your child needs a break</div>
        ${OVERWHELM_SIGNS.map(s => `<div class="body-text" style="margin-bottom:4px">• ${s}</div>`).join("")}
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin:14px 0 6px">🤲 What to do</div>
        ${WHAT_TO_DO.map(s => `<div class="body-text" style="margin-bottom:4px">• ${s}</div>`).join("")}
        <div style="font-family:'Quicksand',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;margin:14px 0 6px">🔄 Reset strategies</div>
        ${RESET_STRATEGIES.map(s => `<div class="body-text" style="margin-bottom:4px">• ${s}</div>`).join("")}
        <div class="tipbox"><div class="lbl">🩺 Dr Chitra Says</div><div class="txt">A quiet or slow response usually means your child needs more time to think — it does not mean they got it wrong.</div></div>
        <button class="btn-primary modal-close" data-action="close-modal">Close</button>
      </div>
    `;
  } else if (modal === "add-win-global") {
    const options = [`<option value="">General (not tied to one area)</option>`]
      .concat(state.selectedDomains.map(id => {
        const d = getDomain(id);
        return `<option value="${id}">${d.icon} ${d.title}</option>`;
      })).join("");
    overlay.innerHTML = `
      <div class="modal-sheet">
        <h2>⭐ Add a Small Win</h2>
        <p class="body-text">A small win is anything that feels like progress.</p>
        <textarea id="global-win-input" rows="3" aria-label="Small win today" placeholder="What did you notice today?"></textarea>
        <div style="height:10px"></div>
        <label style="font-size:13px;color:var(--ink-soft);font-weight:700">Which area is this about? (optional)</label>
        <div style="height:6px"></div>
        <select id="global-win-domain" style="width:100%;border:2px solid var(--peach-card-2);border-radius:12px;padding:12px;font-family:inherit;font-size:14.5px;background:var(--white);color:var(--ink)">
          ${options}
        </select>
        <div style="height:14px"></div>
        <button class="btn-primary" data-action="save-global-win">Save Small Win</button>
        <button class="btn-text modal-close" data-action="close-modal" style="display:block;margin:10px auto 0">Cancel</button>
      </div>
    `;
  } else if (modal === "confirm-delete" && pendingDelete) {
    const label = pendingDelete.type === "win" ? "small win" : "activity idea";
    overlay.innerHTML = `
      <div class="modal-sheet">
        <h2>🗑️ Delete this ${label}?</h2>
        <p class="body-text">"${escapeHtml(pendingDelete.preview || "")}"</p>
        <p class="body-text" style="font-size:13px"><b>This can't be undone.</b></p>
        <button class="btn-primary" style="background:var(--coral-dark)" data-action="do-delete">Delete</button>
        <button class="btn-text modal-close" data-action="close-modal" style="display:block;margin:10px auto 0">Cancel</button>
      </div>
    `;
  }
  app.appendChild(overlay);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function applyWordFilter(q) {
  q = (q || "").trim().toLowerCase();
  let anyVisible = false;
  app.querySelectorAll("[data-cat-block]").forEach(block => {
    let blockHasMatch = false;
    block.querySelectorAll(".word-pill").forEach(chip => {
      const match = !q || chip.getAttribute("data-word-text").includes(q);
      chip.style.display = match ? "" : "none";
      if (match) blockHasMatch = true;
    });
    block.style.display = blockHasMatch ? "" : "none";
    if (blockHasMatch) anyVisible = true;
  });
  const noMatch = document.getElementById("no-word-match");
  if (noMatch) noMatch.style.display = anyVisible ? "none" : "block";
}

function attachHandlers() {
  app.querySelectorAll('[role="button"], [role="checkbox"]').forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        el.click();
      }
    });
  });

  const searchInput = document.getElementById("word-search-input");
  if (searchInput) {
    searchInput.addEventListener("input", () => {
      wordSearchQuery = searchInput.value;
      applyWordFilter(wordSearchQuery);
    });
    if (wordSearchQuery) applyWordFilter(wordSearchQuery);
  }

  app.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => nav(el.getAttribute("data-nav")));
  });
  app.querySelectorAll("[data-open-domain]").forEach(el => {
    el.addEventListener("click", () => nav("domain", el.getAttribute("data-open-domain"), "checklist"));
  });
  app.querySelectorAll("[data-tab]").forEach(el => {
    el.addEventListener("click", () => { const newTab = el.getAttribute("data-tab"); if (newTab !== "words") celebrationMsg = null; route.tab = newTab; render(); });
  });
  app.querySelectorAll("[data-toggle-domain]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-toggle-domain");
      const idx = state.selectedDomains.indexOf(id);
      if (idx === -1) { state.selectedDomains.push(id); ensureDomainState(id); }
      else state.selectedDomains.splice(idx, 1);
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-mark]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, idx, mark] = el.getAttribute("data-mark").split("|");
      const ds = ensureDomainState(domainId);
      ds.stageMarks[idx] = mark;
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-play-mark]").forEach(el => {
    el.addEventListener("click", () => {
      const parts = el.getAttribute("data-play-mark").split("|");
      const domainId = parts[0];
      const mark = parts[parts.length - 1];
      const key = parts.slice(1, -1).join("|");
      const ds = ensureDomainState(domainId);
      ds.playSkillMarks[key] = mark;
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-toggle-gen]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, key] = el.getAttribute("data-toggle-gen").split("|");
      const ds = ensureDomainState(domainId);
      if (!ds.generalization) ds.generalization = defaultGeneralization();
      ds.generalization[key] = !ds.generalization[key];
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-word-r]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, word] = el.getAttribute("data-word-r").split("|");
      const ds = ensureDomainState(domainId);
      const mark = getWordMark(ds, word);
      mark.r = !mark.r;
      if (!mark.r && !mark.e) delete ds.wordMarks[word]; else ds.wordMarks[word] = mark;
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-word-e]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, word] = el.getAttribute("data-word-e").split("|");
      const ds = ensureDomainState(domainId);
      const d = getDomain(domainId);
      const mark = getWordMark(ds, word);
      const wasSays = mark.e === 2;
      mark.e = (mark.e + 1) % 3;
      if (!mark.r && !mark.e) delete ds.wordMarks[word]; else ds.wordMarks[word] = mark;
      ds.lastActivityDate = todayISO();
      if (!wasSays && mark.e === 2 && d && d.hasWordBank) {
        const saysCount = d.wordCategories.flatMap(c => c.words).map(w => getWordMark(ds, w)).filter(m => m.e === 2).length;
        if (WORD_MILESTONES.includes(saysCount)) {
          celebrationMsg = saysCount === 1
            ? "🎉 First word said! This is a big one."
            : `🎉 ${saysCount} words said! Look how far you've come.`;
        }
      }
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-gesture-r]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, gesture] = el.getAttribute("data-gesture-r").split("|");
      const ds = ensureDomainState(domainId);
      const mark = getGestureMark(ds, gesture);
      mark.r = !mark.r;
      if (!mark.r && !mark.e) delete ds.gestureMarks[gesture]; else ds.gestureMarks[gesture] = mark;
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-gesture-e]").forEach(el => {
    el.addEventListener("click", () => {
      const [domainId, gesture] = el.getAttribute("data-gesture-e").split("|");
      const ds = ensureDomainState(domainId);
      const mark = getGestureMark(ds, gesture);
      mark.e = (mark.e + 1) % 3;
      if (!mark.r && !mark.e) delete ds.gestureMarks[gesture]; else ds.gestureMarks[gesture] = mark;
      ds.lastActivityDate = todayISO();
      saveState();
      render();
    });
  });
  app.querySelectorAll("[data-before-start]").forEach(el => {
    el.addEventListener("change", () => {
      const ds = ensureDomainState(el.getAttribute("data-before-start"));
      ds.beforeYouStart = el.value;
      saveState();
    });
  });

  const actionEls = app.querySelectorAll("[data-action]");
  actionEls.forEach(el => {
    el.addEventListener("click", () => {
      const raw = el.getAttribute("data-action");
      const i = raw.indexOf("|");
      const action = i === -1 ? raw : raw.slice(0, i);
      const arg = i === -1 ? undefined : raw.slice(i + 1);
      handleAction(action, arg);
    });
  });
}

function handleAction(action, arg) {
  if (action === "dismiss-first-use") {
    state.firstUseSeen = true; saveState(); render();
  } else if (action === "start-picker") {
    nav("domainPicker");
  } else if (action === "finish-picker") {
    if (state.selectedDomains.length) { saveState(); nav("home"); }
  } else if (action === "open-export") {
    nav("export");
  } else if (action === "open-reset") {
    modal = "reset"; render();
  } else if (action === "open-add-win") {
    modal = "add-win-global"; render();
  } else if (action === "save-global-win") {
    const input = document.getElementById("global-win-input");
    const domainSel = document.getElementById("global-win-domain");
    if (input && input.value.trim()) {
      state.smallWins.push({
        id: Date.now().toString(36),
        domainId: domainSel && domainSel.value ? domainSel.value : null,
        date: todayISO(),
        text: input.value.trim()
      });
      saveState();
      modal = null;
      render();
    }
  } else if (action === "close-modal") {
    modal = null; pendingDelete = null; render();
  } else if (action === "confirm-delete-win") {
    const win = state.smallWins.find(w => w.id === arg);
    pendingDelete = { type: "win", id: arg, preview: win ? win.text : "" };
    modal = "confirm-delete"; render();
  } else if (action === "confirm-delete-custom") {
    const [domainId, activityId] = arg.split("|");
    const ds = ensureDomainState(domainId);
    const item = (ds.customActivities || []).find(c => c.id === activityId);
    pendingDelete = { type: "custom", domainId, id: activityId, preview: item ? item.text : "" };
    modal = "confirm-delete"; render();
  } else if (action === "do-delete") {
    if (pendingDelete) {
      if (pendingDelete.type === "win") {
        state.smallWins = state.smallWins.filter(w => w.id !== pendingDelete.id);
      } else if (pendingDelete.type === "custom") {
        const ds = ensureDomainState(pendingDelete.domainId);
        ds.customActivities = (ds.customActivities || []).filter(c => c.id !== pendingDelete.id);
      }
      saveState();
    }
    pendingDelete = null; modal = null; render();
  } else if (action === "advance-week") {
    const ds = ensureDomainState(arg);
    ds.cycleWeek = Math.min(4, ds.cycleWeek + 1);
    ds.lastActivityDate = todayISO();
    saveState(); render();
  } else if (action === "advance-cycle") {
    const ds = ensureDomainState(arg);
    ds.cycleWeek = 1;
    ds.cycleCount += 1;
    ds.cycleStartDate = todayISO();
    ds.lastActivityDate = todayISO();
    ds.generalization = defaultGeneralization();
    saveState(); render();
  } else if (action === "save-favorites") {
    state.favorites = {
      toys: (document.getElementById("fav-toys") || {}).value || "",
      foods: (document.getElementById("fav-foods") || {}).value || "",
      songs: (document.getElementById("fav-songs") || {}).value || "",
      activities: (document.getElementById("fav-activities") || {}).value || ""
    };
    saveState();
    nav("home");
  } else if (action === "dismiss-tab-hint") {
    state.tabHintSeen = true;
    saveState();
    render();
  } else if (action === "dismiss-celebration") {
    celebrationMsg = null;
    render();
  } else if (action === "add-win") {
    const input = document.getElementById("win-input");
    if (input && input.value.trim()) {
      state.smallWins.push({ id: Date.now().toString(36), domainId: arg, date: todayISO(), text: input.value.trim() });
      saveState(); render();
    }
  } else if (action === "add-custom-activity") {
    const input = document.getElementById("custom-activity-input");
    if (input && input.value.trim()) {
      const ds = ensureDomainState(arg);
      if (!ds.customActivities) ds.customActivities = [];
      ds.customActivities.push({ id: Date.now().toString(36), text: input.value.trim(), date: todayISO() });
      ds.lastActivityDate = todayISO();
      saveState(); render();
    }
  } else if (action === "do-export") {
    state.lastExportDate = todayISO();
    saveState();
    window.print();
  }
}

/* ---------------- Init ---------------- */
render();
</script>
</body>
</html>
